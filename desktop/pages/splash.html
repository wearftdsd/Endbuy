<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <title>endBuy</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card {
        position: absolute;
        inset: 10px;
        border-radius: 22px;
        background: radial-gradient(420px 260px at 20% 0%, #00c2a840, transparent), radial-gradient(360px 260px at 100% 100%, #0b8bf540, transparent), #0b0d10;
        border: 1px solid #262a31;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #e9ebee;
        overflow: hidden;
      }
      .logo {
        width: 96px;
        height: 96px;
        animation: float 2.4s ease-in-out infinite;
        filter: drop-shadow(0 10px 24px rgba(0, 194, 168, 0.35));
      }
      h1 {
        margin: 18px 0 4px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      h1 span {
        color: #00c2a8;
      }
      p {
        margin: 0;
        color: #7b838e;
        font-size: 13px;
      }
      .bar {
        margin-top: 26px;
        width: 160px;
        height: 4px;
        border-radius: 4px;
        background: #20242a;
        overflow: hidden;
      }
      .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #00d9b5, #0b8bf5);
        animation: load 1.1s ease-in-out infinite;
      }
      .badge {
        position: absolute;
        bottom: 18px;
        font-size: 11px;
        font-weight: 700;
        color: white;
        padding: 4px 10px;
        border-radius: 99px;
        background: linear-gradient(120deg, #ffb224, #ff6a5c 50%, #ff3d8b);
      }
      @keyframes float {
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes load {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00D9B5" />
            <stop offset="1" stop-color="#0B8BF5" />
          </linearGradient>
        </defs>
        <path d="M14 4h36c5.5 0 10 4.5 10 10v28c0 5.5-4.5 10-10 10H27l-11 9v-9h-2C8.5 52 4 47.5 4 42V14C4 8.5 8.5 4 14 4z" fill="url(#g)" />
        <path d="M18.5 28.5h27M45.5 28.5a13.5 13.5 0 1 0-4 9.6" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" />
      </svg>
      <h1>end<span>Buy</span></h1>
      <p>Démarrage en cours…</p>
      <div class="bar"></div>
      <div class="badge">Nitro Lifetime offert</div>
    </div>
  </body>
</html>
